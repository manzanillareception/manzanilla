name: Build verified signed APK
on:
  workflow_dispatch:
    inputs:
      openai_live_probe:
        description: 'Run two bounded synthetic OpenAI-only voice latency trials using a temporary test secret'
        type: boolean
        default: false
  workflow_call: {}
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  openai-latency:
    needs: verify
    # Explicit manual opt-in only. This secret never enters any Android build job.
    if: github.event_name == 'workflow_dispatch' && inputs.openai_live_probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: openai-translation-benchmark
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'websockets==15.0.1'
      - name: Verify the bounded benchmark offline
        run: python -m unittest discover -s scripts -p 'test_benchmark_openai_translation.py' -v
      - name: Measure two synthetic OpenAI-only voice trials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          python scripts/benchmark_openai_translation.py \
            --contract scripts/openai_translation_contract.json \
            --output "$RUNNER_TEMP/openai-translation-benchmark.json" \
            --run-provider-benchmark
      - name: Retain sanitized OpenAI benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-translation-benchmark
          path: ${{ runner.temp }}/openai-translation-benchmark.json
          if-no-files-found: ignore
  cartesia-agent:
    # This repair is verified offline: the owner explicitly excluded Cartesia API tests.
    runs-on: ubuntu-latest
    outputs:
      agent_id: ${{ steps.config.outputs.agent_id }}
    steps:
      - name: Use the existing Cartesia V1 agent without provider calls
        id: config
        shell: bash
        run: |
          set -euo pipefail
          agent_id='agent_ieQcM2k2FS1ckJL4X2yZqR'
          printf 'agent_id=%s\n' "$agent_id" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/cartesia-config"
          printf '{"agent_id":"%s","provider_tests":"not_run","reason":"owner_requested_offline_verification"}\n' "$agent_id" > "$RUNNER_TEMP/cartesia-config/cartesia-build-config.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cartesia-v1-build-config
          path: ${{ runner.temp }}/cartesia-config/cartesia-build-config.json
          if-no-files-found: error
  signed-apk:
    needs: [verify, cartesia-agent]
    env:
      CARTESIA_AGENT_NIGHT: ${{ needs.cartesia-agent.outputs.agent_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Read semantic publication identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < android/VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf '%s/build-tools/34.0.0\n' "$ANDROID_HOME" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: cartesia-v1-build-config
          path: ${{ runner.temp }}/candidate
      - name: Build with existing pilot signing key
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease :hotel:assembleReleaseAndroidTest -PupgradeFixture -PrequireBundledCartesia --no-daemon
          mkdir -p "$RUNNER_TEMP/candidate"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk"
          mkdir -p "$RUNNER_TEMP/upgrade-fixture"
          cp hotel/build/outputs/apk/androidTest/release/hotel-release-androidTest.apk "$RUNNER_TEMP/upgrade-fixture/"
      - name: Check installed-release continuity and APK identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          previous=("$RUNNER_TEMP/previous/"*.apk)
          test "${#previous[@]}" -eq 1
          python android/release_identity.py \
            --apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk" \
            --previous-apk "${previous[0]}" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/candidate/release-metadata.json"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the previous signed release on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify-signed-upgrade.sh
      - name: Retain signed upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-evidence
          path: work/signed-upgrade-qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: orange-signed-pilot-apk
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
